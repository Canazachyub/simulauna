# Workflow para desplegar SimulaUNA en GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se ejecuta en push a main
  push:
    branches: ['main']

  # Permite ejecución manual desde Actions
  workflow_dispatch:

# Permisos para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Job de Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_USE_MOCK: 'false'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job de Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: avisa a Bing (y a los buscadores que lo comparten) qué URLs hay, para que
      # rastreen rápido. Bing alimenta Copilot y parte de ChatGPT search. Google no usa IndexNow.
      - name: Avisar a IndexNow
        continue-on-error: true
        run: |
          sleep 30
          URLS=$(curl -fsS https://simulacros.sinapsispreu.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow             -H 'Content-Type: application/json; charset=utf-8'             -d "{\"host\":\"simulacros.sinapsispreu.com\",\"key\":\"16cc707254eb7cc729fe09e8696be021\",\"keyLocation\":\"https://simulacros.sinapsispreu.com/16cc707254eb7cc729fe09e8696be021.txt\",\"urlList\":$URLS}"
