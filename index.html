    <!-- SPA en GitHub Pages (patrón rafgraph/spa-github-pages): public/404.html redirige una
         ruta profunda (p.ej. /una/examen) a /?/una/examen; este script
         restaura la URL real con history.replaceState ANTES de que cargue React Router. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
